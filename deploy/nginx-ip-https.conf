server {
    listen 80;
    server_name __SERVER_IP__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/serverwatch-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name __SERVER_IP__;
    ssl_certificate /etc/letsencrypt/live/serverwatch-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/serverwatch-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:serverwatch_ip_tls:1m;

    client_max_body_size 64k;
    limit_req zone=serverwatch_login burst=5 nodelay;
    limit_req_status 429;

    location / {
        include /etc/nginx/snippets/serverwatch-proxy.conf;
    }

    location /static/ {
        alias /opt/serverwatch/app/static/;
        add_header X-Content-Type-Options nosniff;
    }
}

server {
    listen 127.0.0.1:8080;
    server_name localhost;
    client_max_body_size 64k;
    limit_req zone=serverwatch_login burst=5 nodelay;
    limit_req_status 429;

    location / {
        include /etc/nginx/snippets/serverwatch-proxy.conf;
    }

    location /static/ {
        alias /opt/serverwatch/app/static/;
        add_header X-Content-Type-Options nosniff;
    }
}
